<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Your Profile</title>
        {% extends 'base_layout.html' %}

        {% block title %}Your Profile{% endblock %}

        {% block extra_css %}
            <style>
                body { font-family: Arial, sans-serif; background-color: #000; color: #0f0; }
                .container { max-width: 600px; margin: 0 auto; }
                form { display: flex; flex-direction: column; gap: 1rem; }
                input, select, textarea { background-color: #333; color: #0f0; border: 1px solid #0f0; padding: 0.5rem; border-radius: 0.25rem; }
                input:focus, select:focus, textarea:focus { outline: none; border-color: #00ff00; }
                button { transition: background-color 0.3s ease; }
                button:hover { background-color: #00cc00; }
                .errors { background-color: #ff0000; color: #ffffff; padding: 1rem; border-radius: 0.5rem; }
            </style>
        {% endblock %}
    </head>
    <body>
        <div class="container mx-auto px-4 py-8">
            <h1 class="text-2xl font-semibold text-green-500 mb-6">Your Profile</h1>
            {% block content %}
                <div>Username: {{ user.username }}</div>
                <div>Email: {{ user.email }}</div>
                <div class="mt-4"></div>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="bg-green-500 text-white py-2 px-4 rounded">Logout</button>
                </form>
            {% endblock %}
        </div>
    </body>
</html>
