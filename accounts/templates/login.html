{% extends 'base_layout.html' %}

{% block title %}Prijava{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen text-green-400">
    <div class="w-full max-w-md bg-green-800 p-8 rounded-lg shadow-lg border border-green-500">
        <h1 class="text-3xl font-bold text-center mb-6">Prijava</h1>
        
        <form method="post" action="/accounts/login/" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label for="username" class="block text-sm font-medium">Korisničko ime:</label>
                <input type="text" id="username" name="username" 
                       class="w-full px-4 py-2 rounded-lg bg-white text-black border border-green-500 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium">Zaporka:</label>
                <input type="password" id="password" name="password" 
                       class="w-full px-4 py-2 rounded-lg bg-white text-black border border-green-500 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
            </div>

            {% if error %}
            <div class="mt-4 bg-red-600 text-white p-4 rounded-lg">
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <button type="submit" class="w-full py-2 mt-4 text-lg font-semibold bg-green-500 text-black rounded-lg transition duration-300 hover:bg-green-400">
                Prijava
            </button>
        </form>
    </div>
</div>
{% endblock %}
