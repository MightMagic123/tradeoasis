{% extends 'base_layout.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-semibold text-green-500 mb-6">Login</h1>
    <form method="post" class="bg-black p-6 rounded-lg border border-green-500">
        {% csrf_token %}
        <div class="mb-4">
            <label for="username" class="block text-green-500 mb-2">Username:</label>
            <input type="text" id="username" name="username" class="w-full p-2 rounded bg-gray-800 text-green-500 border border-green-500" required>
        </div>
        <div class="mb-4">
            <label for="password" class="block text-green-500 mb-2">Password:</label>
            <input type="password" id="password" name="password" class="w-full p-2 rounded bg-gray-800 text-green-500 border border-green-500" required>
        </div>
        <button type="submit" class="w-full bg-green-500 text-black font-semibold py-2 px-4 rounded hover:bg-green-700">Login</button>
        {% if error %}
            <p class="text-red-500 mt-4">{{ error }}</p>
        {% endif %}
    </form>
</div>
{% endblock %}

{% block extra_css %}
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #000;
    color: #0f0;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

form {
    display: flex;
    flex-direction: column;
}
</style>
{% endblock %}
