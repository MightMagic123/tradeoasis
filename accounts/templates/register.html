{% extends 'base_layout.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-semibold text-green-500 mb-6">Register</h1>
    <form method="post" class="bg-black p-6 rounded-lg border border-green-500">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-green-500 text-black font-semibold py-2 px-4 rounded hover:bg-green-700">Register</button>
    </form>
</div>
{% endblock %}

{% block extra_css %}
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #000;
    color: #0f0;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

form {
    display: flex;
    flex-direction: column;
}

form input[type="text"],
form input[type="password"],
form input[type="email"] {
    background-color: #222;
    color: #0f0;
    border: 1px solid #0f0;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 5px;
}

form input[type="text"]::placeholder,
form input[type="password"]::placeholder,
form input[type="email"]::placeholder {
    color: #888;

form button[type="submit"] {
    background-color: #0f0;
    color: #000;
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
    font-weight: bold;
    transition: background-color 0.3s ease;
}

form button[type="submit"]:hover {
    background-color: #0c0;
}

}

</style>
{% endblock %}
