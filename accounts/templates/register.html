{% extends 'base_layout.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-semibold text-green-500 mb-6">Register</h1>
    <form method="post" class="bg-black p-6 rounded-lg border border-green-500">
        {% csrf_token %}
        <div class="mb-4">
            <label for="username" class="block text-green-500 mb-2">Username:</label>
            <input type="text" id="username" name="username" class="w-full p-2 rounded bg-gray-800 text-green-500 border border-green-500" required>
        </div>
        <div class="mb-4">
            <label for="email" class="block text-green-500 mb-2">Email:</label>
            <input type="email" id="email" name="email" class="w-full p-2 rounded bg-gray-800 text-green-500 border border-green-500" required>
        </div>
        <div class="mb-4">
            <label for="password" class="block text-green-500 mb-2">Password:</label>
            <input type="password" id="password" name="password" class="w-full p-2 rounded bg-gray-800 text-green-500 border border-green-500" required>
        </div>
        <div class="mb-4">
            <label for="confirm_password" class="block text-green-500 mb-2">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" class="w-full p-2 rounded bg-gray-800 text-green-500 border border-green-500" required>
        </div>
        <button type="submit" class="w-full bg-green-500 text-black font-semibold py-2 px-4 rounded hover:bg-green-700">Register</button>
    </form>
</div>
{% endblock %}

{% block extra_css %}
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #000;
    color: #0f0;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

input, select, textarea {
    background-color: #333;
    color: #0f0;
    border: 1px solid #0f0;
    padding: 0.5rem;
    border-radius: 0.25rem;
}

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #00ff00;
}

button {
    transition: background-color 0.3s ease;
}

button:hover {
    background-color: #00cc00;
}
</style>
{% endblock %}
