{% extends 'base_layout.html' %}

{% block title %}Interest Calculator{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="bg-white shadow-lg rounded-lg p-8">
        <h2 class="text-2xl font-bold text-primary mb-4 text-center">Interest Calculator</h2>

        <!-- Form for user input -->
        <form id="interest-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-gray-700">Initial Amount (€)</label>
                <input type="text" id="initial" class="w-full p-2 border rounded text-lg text-center text-gray-900" placeholder="1000">
            </div>
            <div>
                <label class="block text-gray-700">Annual Interest Rate (%)</label>
                <input type="text" id="rate" class="w-full p-2 border rounded text-lg text-center text-gray-900" placeholder="10">
            </div>
            <div>
                <label class="block text-gray-700">Monthly Contribution (€)</label>
                <input type="text" id="monthly" class="w-full p-2 border rounded text-lg text-center text-gray-900" placeholder="100">
            </div>
            <div class="col-span-1 md:col-span-3 flex justify-center mt-4">
                <button type="button" onclick="calculateGrowth()" class="bg-primary text-white py-2 px-6 rounded-lg hover:bg-secondary transition">
                    Calculate
                </button>
            </div>
        </form>

        <!-- Result Display -->
        <div id="result" class="text-center mt-6 text-lg font-semibold text-gray-800"></div>

        <!-- Chart for visualization -->
        <canvas id="growthChart" class="mt-6"></canvas>
    </div>
</div>

<!-- Chart.js & Calculation Script -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    function calculateGrowth() {
        // Use placeholders as default values if input is empty
        let initial = parseFloat(document.getElementById("initial").value.replace(",", ".")) || parseFloat(document.getElementById("initial").placeholder);
        let rate = (parseFloat(document.getElementById("rate").value.replace(",", ".")) || parseFloat(document.getElementById("rate").placeholder)) / 100;
        let monthly = parseFloat(document.getElementById("monthly").value.replace(",", ".")) || parseFloat(document.getElementById("monthly").placeholder);
        let years = 30;

        let labels = [];
        let investmentData = [];
        let contributionData = [];
        let balance = initial;
        let contributionTotal = initial;

        for (let i = 0; i <= years; i++) {
            labels.push(`Year ${i}`);
            investmentData.push(balance.toFixed(2));
            contributionData.push(contributionTotal.toFixed(2));

            contributionTotal += monthly * 12;
            balance += monthly * 12;
            balance *= (1 + rate);
        }

        document.getElementById("result").innerHTML = `Final Amount after ${years} years: €${investmentData[years]}`;

        // Update Chart
        let ctx = document.getElementById("growthChart").getContext("2d");
        if (window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: "line",
            data: {
                labels: labels,
                datasets: [
                    {
                        label: "Investment Growth (€)",
                        data: investmentData,
                        borderColor: "#16A34A",
                        backgroundColor: "rgba(22, 163, 74, 0.2)",
                        fill: true
                    },
                    {
                        label: "Contributions Only (€)",
                        data: contributionData,
                        borderColor: "#DC2626", // Red
                        backgroundColor: "rgba(220, 38, 38, 0.2)",
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: false }
                },
                animation: false,
            }
        });
    }
</script>

{% endblock %}
