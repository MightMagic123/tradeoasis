<!DOCTYPE html>
<html>
<head>
    <title>Popular Stocks - TradeOasis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0;
        }
        header {
            background-color: #0a0;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #0b0;
        }
        nav a {
            color: #fff;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }
        nav a:hover {
            background-color: #0c0;
        }
        .container {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #0f0;
            text-align: center;
        }
        a {
            color: #0f0; /* Green color for hyperlinks */
        }
        a:hover {
            color: #ff0; /* Yellow color for hyperlinks on hover */
        }
    </style>
</head>
<body>
    <header>
        <h1>Popular Stocks</h1>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/stocks">Stocks</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>
    <div class="container">
        <h2>Stock Tickers</h2>
        <table>
            <tr>
                <th>Ticker</th>
                <th>Company Name</th>
            </tr>
            {% for ticker, company_name in ticker_company_pairs %}
                <tr>
                    <td><a href="/stock/{{ ticker }}">{{ ticker }}</a></td>
                    <td>{{ company_name }}</td>
                </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
